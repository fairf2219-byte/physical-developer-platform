<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHYSICAL Approval Center</title><style>*{box-sizing:border-box}body{margin:0;background:#090b12;color:#f5f6fa;font:15px Arial}.top{padding:22px 7%;border-bottom:1px solid #252a38;font-weight:900;letter-spacing:3px}.wrap{max-width:1000px;margin:45px auto;padding:0 20px}.card,.item{background:#121622;border:1px solid #282e40;border-radius:14px;padding:22px;margin:16px 0}input,textarea{width:100%;padding:12px;background:#0b0f19;border:1px solid #343b50;border-radius:8px;color:white;margin:8px 0 14px}button{padding:11px 16px;border:0;border-radius:8px;cursor:pointer;font-weight:bold;margin:5px;background:#f4a9ce}.reject{background:#ff9ca8}.muted{color:#9ba3b7}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><header class="top">PHYSICAL — APPROVAL CENTER</header><main class="wrap"><h1>App review queue</h1><section class="card" id="login"><p class="muted">Admin sign-in</p><input id="pw" type="password" placeholder="Admin password"><button id="signin">Sign in</button><p id="error"></p></section><section id="queue" hidden><button id="reload">Refresh queue</button><div id="items"></div></section></main><script>
let token="";const login=document.querySelector("#login"),queue=document.querySelector("#queue");document.querySelector("#signin").onclick=async()=>{token=document.querySelector("#pw").value;const r=await fetch("/api/admin/apps",{headers:{Authorization:"Bearer "+token}});if(!r.ok){document.querySelector("#error").textContent="Incorrect password.";return}login.hidden=true;queue.hidden=false;render(await r.json())};async function load(){const r=await fetch("/api/admin/apps",{headers:{Authorization:"Bearer "+token}});if(r.ok)render(await r.json())}function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function render(apps){document.querySelector("#items").innerHTML=apps.length?apps.map(a=>'<article class="item"><h2>'+esc(a.name)+'</h2><p class="muted">By '+esc(a.developer)+' · '+new Date(a.createdAt).toLocaleString()+'</p><p>'+esc(a.description)+'</p>'+(a.buildUrl?'<p><a target="_blank" rel="noopener" href="'+esc(a.buildUrl)+'">Open build link</a></p>':'')+'<p>Status: <b>'+a.status+'</b></p><textarea id="note-'+a.id+'" placeholder="Optional review note">'+esc(a.reviewNote)+'</textarea><div class="row"><button onclick="review(\''+a.id+'\',\'Approved\')">Approve</button><button class="reject" onclick="review(\''+a.id+'\',\'Rejected\')">Reject</button></div></article>').join(""):'<p class="muted">No submissions yet.</p>'}async function review(id,status){const note=document.querySelector("#note-"+id).value;const r=await fetch("/api/admin/review/"+id,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({status,note})});if(r.ok)load();else alert("Could not update review.")}document.querySelector("#reload").onclick=load;</script></body></html>
