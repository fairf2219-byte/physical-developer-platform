<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHYSICAL Developer Platform</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b12;color:#f5f6fa;font:15px Arial,sans-serif}.top{padding:22px 7%;border-bottom:1px solid #252a38;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:3px}.pill{color:#f7b9d8}.wrap{max-width:1050px;margin:55px auto;padding:0 22px}.hero h1{font-size:42px;margin:0 0 10px}.muted{color:#9ba3b7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:35px}.card{background:#121622;border:1px solid #282e40;border-radius:16px;padding:24px}label{display:block;margin:14px 0 7px;color:#cbd0dc}input,textarea{width:100%;padding:13px;border-radius:9px;border:1px solid #343b50;background:#0b0f19;color:white}textarea{min-height:100px;resize:vertical}button{background:#f4a9ce;color:#17101a;border:0;border-radius:9px;padding:13px 18px;font-weight:bold;cursor:pointer;margin-top:16px}.app{border-top:1px solid #2a3040;padding:15px 0}.status{font-size:12px;border-radius:20px;padding:5px 10px;background:#283247;color:#c5d8ff}.status.Approved{background:#153b2c;color:#8df0b7}.status.Rejected{background:#49232b;color:#ffabb5}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero h1{font-size:32px}}</style></head><body><header class="top"><div class="brand">PHYSICAL <span class="pill">DEVELOPERS</span></div><span class="muted">Developer Portal</span></header><main class="wrap"><section class="hero"><h1>Build. Submit. Get approved.</h1><p class="muted">Submit your app for review and track its approval status.</p></section><div class="grid"><section class="card"><h2>Submit an app</h2><form id="form"><label>App name</label><input name="name" required maxlength="80" placeholder="My Quest App"><label>Developer name</label><input name="developer" required maxlength="80" placeholder="Your name or studio"><label>Description</label><textarea name="description" required maxlength="1000" placeholder="Tell us about your app"></textarea><label>Build link (optional)</label><input name="buildUrl" type="url" placeholder="https://..."><button>Send for review</button></form><p id="msg" class="muted"></p></section><section class="card"><h2>Your submissions</h2><p class="muted">Submissions appear here with their current review status.</p><div id="apps">Loading…</div></section></div></main><script>
const form=document.querySelector("#form"),msg=document.querySelector("#msg");async function refresh(){const r=await fetch("/api/apps");const apps=await r.json();document.querySelector("#apps").innerHTML=apps.length?apps.map(a=>'<div class="app"><b>'+esc(a.name)+'</b><p class="muted">'+esc(a.description)+'</p><span class="status '+a.status+'">'+a.status+'</span>'+(a.reviewNote?'<p class="muted">Review note: '+esc(a.reviewNote)+'</p>':'')+'</div>').join(""):'<p class="muted">No apps submitted yet.</p>'}function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}form.addEventListener("submit",async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));const r=await fetch("/api/apps",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});const j=await r.json();msg.textContent=r.ok?"Submitted! Your app is now pending review.":j.error; if(r.ok){form.reset();refresh()}});refresh();</script></body></html>
