<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHYSICAL App Store</title><style>*{box-sizing:border-box}body{margin:0;background:#090b12;color:#f5f6fa;font:15px Arial}.top{padding:22px 7%;border-bottom:1px solid #252a38;display:flex;justify-content:space-between}.brand{font-weight:900;letter-spacing:3px}.pink{color:#f7b9d8}a{color:#f7b9d8}.wrap{max-width:1100px;margin:55px auto;padding:0 22px}h1{font-size:42px;margin-bottom:8px}.muted{color:#9ba3b7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:32px}.app{background:#121622;border:1px solid #282e40;border-radius:16px;padding:22px;min-height:190px}.app h2{margin-top:0}.button{display:inline-block;margin-top:15px;padding:11px 15px;border-radius:8px;background:#f4a9ce;color:#17101a;text-decoration:none;font-weight:bold}.empty{padding:28px;border:1px dashed #343b50;border-radius:14px;color:#9ba3b7}</style></head><body><header class="top"><div class="brand">PHYSICAL <span class="pink">APP STORE</span></div><a href="/">Developer Portal</a></header><main class="wrap"><h1>Discover apps</h1><p class="muted">Apps approved and published by PHYSICAL.</p><div id="apps" class="grid"><p class="muted">Loading apps…</p></div></main><script>function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}async function load(){const r=await fetch("/api/store");const apps=await r.json();document.querySelector("#apps").innerHTML=apps.length?apps.map(a=>'<article class="app"><h2>'+esc(a.name)+'</h2><p class="muted">By '+esc(a.developer)+'</p><p>'+esc(a.description)+'</p>'+(a.buildUrl?'<a class="button" href="'+esc(a.buildUrl)+'" target="_blank" rel="noopener">Get app</a>':'<span class="muted">No download link provided</span>')+'</article>').join(""):'<div class="empty">No apps have been published yet. Check back soon!</div>'}load();</script></body></html>
